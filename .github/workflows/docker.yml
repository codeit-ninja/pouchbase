# Builds the Docker image (see Dockerfile) for a release and pushes it to GitHub Container Registry
# as ghcr.io/<owner>/<repo>, for linux/amd64 and linux/arm64. Normally called by release.yml after
# Changesets created the release; the `release` trigger covers releases published by hand.
#
# Tags for release v1.2.3: 1.2.3, 1.2, 1 and latest (pre-releases only get their full version).
# Run it by hand from the Actions tab to rebuild the image of an existing tag.

name: Docker image

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        type: string
        required: true
      latest:
        description: Also tag the image as latest
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        required: true
      latest:
        description: Also tag the image as latest (only for the newest release)
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Build provenance attestation.
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Image name
        id: image
        # Registry names must be lowercase.
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ !startsWith(env.TAG, 'v0.') }}
          flavor: |
            latest=${{ github.event_name == 'release' && !github.event.release.prerelease || inputs.latest == true }}
          labels: |
            org.opencontainers.image.title=Pouchbase
            org.opencontainers.image.description=Open-source backend on Cloudflare D1 and R2, inspired by PocketBase
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
